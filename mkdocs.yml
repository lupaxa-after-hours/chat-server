# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
# =============================================================================
# Site Information
# =============================================================================

# Title case of the repo name with hyphens removed (chat-server → Chat Server).
site_name: Chat Server

site_description: >-
  A multi-room TCP chat server. Players pick a name, start in one room,
  and talk to the other people there.

site_author: The Lupaxa Project

site_url: https://chat-server.thelupaxaproject.org/

repo_name: lupaxa-after-hours/chat-server
repo_url: https://github.com/lupaxa-after-hours/chat-server

extra:
  generator: false
  # Hide left site nav (header already lists pages); keep on-this-page TOC.
  # Default when omitted: false (left nav visible).
  hide_primary_sidebar: false
  # Viewer language picker (client-side translation; English URLs).
  # Default when omitted: false (picker hidden).
  language_picker: true
  # Footer (rendered by overrides/partials/copyright.html).
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  # Counter.dev analytics. Same id on every Lupaxa docs site.
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: assets/images/the-lupaxa-project-social-card.png
  social_logo: assets/images/logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs
site_dir: site
use_directory_urls: true

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.sections
    - toc.follow

  palette:
    scheme: slate
    primary: blue
    accent: light blue

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search

hooks:
  - hooks/asset_cache_bust.py

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage:
      - Connect: usage/index.md
      - Players: usage/players.md
      - Rooms: usage/rooms.md
      - Commands: usage/commands.md
  - Reference: reference.md
  - Examples: examples.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css
  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/tables.css
  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/language-preference.js
  - assets/javascript/header-active-nav.js
